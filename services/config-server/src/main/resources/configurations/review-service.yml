server:
  port: 8061

spring:
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/review?authSource=admin

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans