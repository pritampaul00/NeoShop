spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:root@localhost:27017/customer?authSource=admin}

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}